<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>買い物リスト</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    html, body { margin: 0; height: 100%; }
    iframe { display: block; border: 0; width: 100%; height: 100%; }
    /* 案内。アプリから「表示した」の合図が来ないときだけ出す */
    details { position: fixed; right: 8px; bottom: 8px; font: 14px sans-serif; background: #fff; padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; }
    details[hidden] { display: none; }
  </style>
</head>
<body>
  <!-- https://script.google.com/macros/s/AKfycbwINw3aOPEVD5Dh13r6Ff84fulUQz8aFbhpTspit2fJ5eHTZiSSnvJlATviWQhFjflu1g/exec を Apps Script の /exec の URL に置き換える -->
  <iframe src="https://script.google.com/macros/s/AKfycbwINw3aOPEVD5Dh13r6Ff84fulUQz8aFbhpTspit2fJ5eHTZiSSnvJlATviWQhFjflu1g/exec"></iframe>
  <details id="help" hidden>
    <summary>表示されないとき</summary>
    <p>先に Google にログインしてから、このページを開き直してください。</p>
    <p>初回は <a href="https://script.google.com/macros/s/AKfycbwINw3aOPEVD5Dh13r6Ff84fulUQz8aFbhpTspit2fJ5eHTZiSSnvJlATviWQhFjflu1g/exec" target="_blank" rel="noopener">こちら</a> を開いて承認してから戻ってください。</p>
  </details>
  <script>
    (function () {
      // アプリが画面を出すと window.top へ { type: 'shopping-list', status: 'ready' } を送ってくる（アプリ側 App.html）。
      // この時間までに来なければ案内を出す（未ログイン・未承認・利用不可のとき）。来れば出さない。
      // 送信元オリジンは確認しない: 合図はデータを含まず、案内を出すかどうかを決めるだけ。Google の sandbox のオリジンは固定できない
      var READY_WAIT_MS = 15000;
      var help = document.getElementById('help');
      var ready = false;
      var timer = setTimeout(function () {
        if (!ready) help.hidden = false;
      }, READY_WAIT_MS);

      window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || typeof data !== 'object') return;
        if (data.type !== 'shopping-list' || data.status !== 'ready') return;
        ready = true;
        clearTimeout(timer);
        help.hidden = true;
      });
    })();
  </script>
</body>
</html>
